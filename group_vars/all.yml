starship_gist: https://gist.githubusercontent.com/sedelpeuch/1fc26438431e6a29ea35b102b40ab367/raw
zshrc_gist: https://gist.githubusercontent.com/sedelpeuch/a595fc7352f803c089534b00cba9e2e7/raw

fzf_version: "0.67.0"
node_version: "24.19.0"

omz_plugins:
  zsh-autosuggestions: https://github.com/zsh-users/zsh-autosuggestions
  zsh-syntax-highlighting: https://github.com/zsh-users/zsh-syntax-highlighting
  fzf-tab: https://github.com/Aloxaf/fzf-tab
  you-should-use: https://github.com/MichaelAquilina/zsh-you-should-use

claude_status_line:
  type: command
  command: ~/.local/bin/claude-statusline.sh

# GNOME (configure_gnome.yml)
gnome_extensions:
  - blur-my-shell@aunetx
  - rounded-window-corners@fxgn
  - dynamic-music-pill@andbal
  - notification-icons@muhammad_ans.github
  - notification-configurator@exposedcat
  - hidetopbar@mathieu.bidon.ca
  - quick-settings-audio-panel@rayzeq.github.io
  - bluetooth-quick-connect@bjarosze.gmail.com
  - Rounded_Corners@lennart-k
  - panel-corners@aunetx

# Right margin (px) of notification banners: 0 unless GNOME shifts them right
# and a relog does not fix it (e.g. -e gnome_notif_right_margin=254)
gnome_notif_right_margin: 0

# Values in GVariant syntax, exactly as `dconf read` prints them
gnome_dconf:
  - key: /org/gnome/shell/extensions/blur-my-shell/applications/blur
    value: "true"
  - key: /org/gnome/shell/extensions/blur-my-shell/applications/opacity
    value: "255"
  - key: /org/gnome/shell/extensions/blur-my-shell/applications/whitelist
    value: "['Terminator', 'terminator']"
  # Popup blur draws black square corners on GNOME 50
  - key: /org/gnome/shell/extensions/blur-my-shell/popup/blur
    value: "false"
  - key: /org/gnome/shell/extensions/hidetopbar/mouse-sensitive
    value: "true"
  - key: /org/gnome/shell/extensions/notification-configurator/global
    value: >-
      '{"display":{"notificationPosition":"center","verticalPosition":"top"},"margins":{"enabled":true,"top":0,"bottom":0,"left":0,"right":{{ gnome_notif_right_margin }}},"colors":{"enabled":true,"theme":{"appNameColor":[0.6,0.6,0.61,1],"timeColor":[0.6,0.6,0.61,1],"backgroundColor":[0,0,0,0.8],"titleColor":[0.99,0.99,0.99,1],"bodyColor":[0.85,0.85,0.86,1],"appNameFontSize":14,"timeFontSize":12,"titleFontSize":15,"bodyFontSize":14}}}'
