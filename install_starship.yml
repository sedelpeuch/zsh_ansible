- name: Install starship
  hosts: all
  tasks:
    - name: Install starship
      become: true
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://starship.rs/install.sh | sh -s -- -y
        executable: /bin/bash
        creates: /usr/local/bin/starship

    - name: Create config directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config"
        state: directory
        mode: "0755"

    - name: Deploy starship.toml from gist
      ansible.builtin.get_url:
        url: "{{ starship_gist }}/starship.toml"
        dest: "{{ ansible_env.HOME }}/.config/starship.toml"
        mode: "0644"
        force: true
