- name: Ensure starship is installed
  hosts: all
  become: yes
  tasks:
    - name: Ensure curl is installed
      apt:
        name: curl
        state: present

    - name: Check if starship is installed
      command: which starship
      register: starship_installed
      failed_when: false

    - name: Download starship installer
      get_url:
        url: https://starship.rs/install.sh
        dest: /tmp/install_starship.sh
        mode: '0755'
      when: starship_installed.rc != 0

    - name: Install starship
      shell: /tmp/install_starship.sh -y
      when: starship_installed.rc != 0

    - name: Ensure config directory exists
      file:
        path: ~/.config
        state: directory
        mode: '0755'

    - name: Fetch starship.toml from secret gist
      uri:
        url: "https://gist.githubusercontent.com/sedelpeuch/1fc26438431e6a29ea35b102b40ab367/raw"
        return_content: yes
      register: starship_config_content

    - name: Place starship.toml in config directory
      copy:
        content: "{{ starship_config_content.content }}"
        dest: ~/.config/starship.toml
