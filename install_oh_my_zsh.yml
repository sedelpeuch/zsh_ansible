- name: Install oh-my-zsh and plugins
  hosts: all
  tasks:
    - name: Install oh-my-zsh
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh | sh -s -- --unattended --keep-zshrc
        executable: /bin/bash
        creates: "{{ ansible_env.HOME }}/.oh-my-zsh/oh-my-zsh.sh"

    - name: Clone custom plugins
      ansible.builtin.git:
        repo: "{{ item.value }}"
        dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins/{{ item.key }}"
        depth: 1
        update: false
      loop: "{{ omz_plugins | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
