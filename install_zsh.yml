- name: Install zsh and base packages
  hosts: all
  tasks:
    - name: Install packages
      become: true
      ansible.builtin.apt:
        name:
          - zsh
          - git
          - curl
          - ca-certificates
          - tar
          - xz-utils
          - jq
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Set zsh as login shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/zsh
